[project]
name = "quantized-yolo-finn"
version = "0.1.0"
description = "A repository for implementing a quantized YOLO object detection model using FINN on FPGAs."
requires-python = ">=3.10,<3.14"
dependencies = [
    # YOLO training backbone
    "ultralytics>=8.0",
    # Utilities
    "pyyaml>=6.0",
    "pydantic>=2.13.4",
    "brevitas>=0.13.0",
]

[project.scripts]
qyf = "qyf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qyf"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
